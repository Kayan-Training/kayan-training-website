     tight viewBox for use as a standalone inline icon. See also the official PNG bundle
     (/Style%20Library/CBO/downloads/png.zip -> Medium.png) for a rendered reference of this same
     glyph, and the guidelines PDF (/Style%20Library/CBO/downloads/The%20Omani%20Rial%20Sign%20Guidelines.pdf). -->
