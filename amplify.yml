version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^(DATABASE_URL|DATABASE_URL_UNPOOLED|BETTER_AUTH_SECRET|BETTER_AUTH_URL|BETTER_AUTH_TRUSTED_ORIGINS|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_REGION|S3_BUCKET|S3_PUBLIC_BASE_URL|RESEND_API_KEY|EMAIL_FROM|NEXT_PUBLIC_APP_URL)=' >> .env.production || true
        - corepack enable
        - corepack prepare pnpm@9.15.0 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - ~/.pnpm-store/**/*
